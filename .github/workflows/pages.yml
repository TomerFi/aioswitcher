---
name: Pages Deploy

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{github.ref}}
  cancel-in-progress: true

env:
  MAIN_PY_VER: "3.13"

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      pages: write
      contents: write
    name: Build documentation site and deploy to GH-Pages
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: ${{ env.MAIN_PY_VER }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build documentation site
        run: uv run mkdocs build --strict

      - name: Deploy to GH-Pages
        uses: peaceiris/actions-gh-pages@1ef5a1b1df4c63fe21a2242edbee6cac921ece01  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: aioswitcher.figenblat.com
          commit_message: 'docs: deployed documentation site '
