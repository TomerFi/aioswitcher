---
name: Stage

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - src/**
      - tests/**
      - pyproject.toml
      - uv.lock

concurrency:
  group: ${{ github.workflow }}-${{github.ref}}
  cancel-in-progress: true

env:
  MAIN_PY_VER: "3.14"

jobs:
  test:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    name: Stage project
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup timezone
        uses: zcong1993/setup-timezone@040202c2ecba2d55edb016acf01bbeb42261dfc0  # v2.0.0
        with:
          timezone: Asia/Jerusalem

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ env.MAIN_PY_VER }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install, test with coverage report, and build
        run: |
          uv run --locked pytest -v --cov --cov-report=xml:coverage.xml --junit-xml=junit.xml
          uv build

      - name: Push to CodeCov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
