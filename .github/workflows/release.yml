---
name: Release

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Release title defaults to the semantic version"
        required: false
      bump:
        description: "Bump type (major/minor/patch) defaults to auto"
        default: "auto"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
          - auto

concurrency:
  group: ${{ github.workflow }}-${{github.ref}}
  cancel-in-progress: false

env:
  MAIN_PY_VER: "3.14"

jobs:
  release:
    runs-on: ubuntu-latest
    environment: deployment
    permissions:
      contents: write
      id-token: write
    name: Build, publish, and release
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: ${{ env.MAIN_PY_VER }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup SSH signing
        run: |
          mkdir -p "$RUNNER_TEMP"
          echo "${{ secrets.SIGNING_KEY }}" > "$RUNNER_TEMP/signing_key"
          chmod 600 "$RUNNER_TEMP/signing_key"
          git config gpg.format ssh
          git config user.signingkey "$RUNNER_TEMP/signing_key"
          git config commit.gpgsign true

      - name: Determine version and create changelog
        id: bumper
        uses: tomerfi/version-bumper-action@2d160ea4d1b4e1bc5534c9eece726a1227b19afd  # 2.0.9
        with:
          bump: '${{ github.event.inputs.bump }}'

      - name: Set new project version
        uses: sandstromviktor/toml-editor@49b76fb8c351868945711489fd30ba3de29191a5  # 2.0.0
        with:
          file: pyproject.toml
          key: project.version
          value: ${{ steps.bumper.outputs.next }}

      - name: Commit, tag, and push
        run: |
          git add pyproject.toml
          git commit -m "build: bump version to ${{ steps.bumper.outputs.next }} [skip ci]"
          git push
          git tag ${{ steps.bumper.outputs.next }} -m "${{ steps.bumper.outputs.next }}"
          git push origin ${{ steps.bumper.outputs.next }}

      - name: Verify documentation site build
        run: uv sync --locked --group docs && uv run --locked mkdocs build --strict

      - name: Publish build to PyPi
        run: |
          rm -rf ./dist
          uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@2834a314042ef964da07689278dd1e9d773e8afd  # v1.14.1

      - name: Set development project version
        uses: sandstromviktor/toml-editor@49b76fb8c351868945711489fd30ba3de29191a5  # 2.0.0
        with:
          file: pyproject.toml
          key: project.version
          value: ${{ steps.bumper.outputs.dev }}

      - name: Commit and push
        run: |
          git add pyproject.toml
          git commit -m "build: bump version to ${{ steps.bumper.outputs.dev }} [skip ci]"
          git push

      - name: Create a release name
        id: release_name
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553  # v9.0.0
        with:
          script: |
            var retval = '${{ steps.bumper.outputs.next }}'
            if ('${{ github.event.inputs.title }}') {
              retval = retval.concat(' - ${{ github.event.inputs.title }}')
            }
            core.setOutput('value', retval)

      - name: Create a release
        id: gh_release
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553  # v9.0.0
        with:
          github-token: ${{ secrets.RELEASE_PAT }}
          script: |
            const repo_name = context.payload.repository.full_name
            const response = await github.request('POST /repos/' + repo_name + '/releases', {
              tag_name: '${{ steps.bumper.outputs.next }}',
              name: '${{ steps.release_name.outputs.value }}',
              generate_release_notes: true
            })
            core.setOutput('html_url', response.data.html_url)
